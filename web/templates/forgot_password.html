<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Forgot Password - Host Assistant</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#0066CC",
                        "success": "#10B981",
                        "warning": "#F59E0B",
                        "error": "#EF4444"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Inter", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Inter", "sans-serif"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="h-full font-body bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 flex flex-col">
<!-- TopNavBar (Shell Suppression Logic Applied: Not rendered for transactional/focus pages) -->
<!-- The prompt defines a focused "Forgot password" screen, which according to the Shell Visibility & Relevance rule, prioritizes the content canvas over the global nav shell. -->
<main class="flex-grow flex items-center justify-center px-4 sm:px-6 lg:px-8">
<div class="max-w-md w-full space-y-8">
<!-- Branding/Identity -->
<div class="text-center">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-xl bg-blue-50 dark:bg-blue-900/30 mb-6">
<span class="material-symbols-outlined text-blue-700 dark:text-blue-400 text-4xl">lock_reset</span>
</div>
<h1 class="text-3xl font-extrabold text-gray-900 dark:text-white tracking-tight font-headline">
                    Forgot your password?
                </h1>
<p class="mt-3 text-sm text-gray-600 dark:text-gray-400 max-w-xs mx-auto">
                    Enter the email address associated with your account and we'll send you a link to reset your password.
                </p>
</div>
<!-- Content Card -->
<div class="bg-white dark:bg-gray-800 p-8 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700">
<form action="/forgot-password" class="space-y-6" method="POST">
<input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
<div>
<label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2" for="email-address">
                            Email address
                        </label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-gray-400 text-xl">mail</span>
</div>
<input autocomplete="email" class="appearance-none block w-full pl-10 pr-3 py-3 border border-gray-300 dark:border-gray-600 rounded-lg placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent sm:text-sm bg-white dark:bg-gray-900" id="email-address" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<div>
<button class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-bold rounded-lg text-white bg-blue-700 hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all active:scale-[0.98]" type="submit">
                            Reset Password
                        </button>
</div>
</form>
<div class="mt-8 pt-6 border-t border-gray-100 dark:border-gray-700 text-center">
<a class="inline-flex items-center text-sm font-semibold text-blue-700 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300 transition-colors" href="/login">
<span class="material-symbols-outlined text-lg mr-2">arrow_back</span>
                        Back to Login
                    </a>
</div>
</div>
<!-- Aesthetic Supporting Element -->
<div class="relative overflow-hidden rounded-xl h-24 mt-8">
<div class="absolute inset-0 bg-gradient-to-r from-blue-600/10 to-transparent"></div>
<img alt="Decorative background" class="w-full h-full object-cover opacity-50 dark:opacity-20" data-alt="abstract soft blue gradient with wavy architectural lines and clean minimalist professional lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAUZxJUEB1Hg9Qy-2MivWWWRAWOZ5gE-CYOeBIYgj6ijq8fQSSwESllkeNV6p6jEIwAsnseVlg4m91i1Q2-5DTKie8R7aUohp8TDcSosc9FXWb1r_fwj8fLsrRtv6xbMVFYFtfp-HCRiPKpUMsyKfrFeqhR2RrDwh9q1LkolywmgvjyBfMkUnsldn8TwdDo0kcZcLvL-pSJm-fdTvOXaFnyzXLfKDKqH4IaoxtIknjDMTEXfMtsAkGl5u23415l0QtXoXQhqFnZNwaN"/>
</div>
</div>
</main>
<!-- Shared Component: Footer -->
<footer class="bg-gray-50 dark:bg-gray-950 border-t border-gray-200 dark:border-gray-800 flex flex-col md:flex-row justify-between items-center px-8 py-6 w-full mt-auto">
<div class="mb-4 md:mb-0">
<span class="text-lg font-bold text-gray-900 dark:text-white">Host Assistant</span>
</div>
<div class="flex flex-wrap justify-center gap-6 mb-4 md:mb-0">
<a class="text-sm font-normal text-gray-500 dark:text-gray-400 hover:text-blue-700 dark:hover:text-blue-300 transition-colors duration-200" href="/privacy">Privacy Policy</a>
<a class="text-sm font-normal text-gray-500 dark:text-gray-400 hover:text-blue-700 dark:hover:text-blue-300 transition-colors duration-200" href="/terms">Terms of Service</a>
<a class="text-sm font-normal text-gray-500 dark:text-gray-400 hover:text-blue-700 dark:hover:text-blue-300 transition-colors duration-200" href="/settings">Contact Support</a>
</div>
<div class="text-sm font-normal text-gray-500 dark:text-gray-400">
            © 2024 Airbnb Host Assistant. All rights reserved.
        </div>
</footer>
</body></html>
